plugins { id 'com.android.application' }

android {
    namespace 'com.jimmy.spider'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jimmy.spider'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName System.getenv('APP_VERSION') ?: '1.0'
    }
    signingConfigs {
        release {
            // 簽章資料由 GitHub Secrets 提供（見 .github/workflows/release.yml）
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
