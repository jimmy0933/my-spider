name: Release

# 發佈方式：git tag v1.0.1 && git push origin v1.0.1（或到 Actions 頁面手動執行）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本標籤，例如 v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 提醒：先確認簽章 key 已放好
        run: |
          missing=""
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            msg="還沒放簽章 key！請先到 Settings → Secrets and variables → Actions 新增：$missing，放好後再重跑。"
            echo "::error::$msg"
            echo "### ⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "簽章 key 都已就緒 ✅"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 還原 keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 建置已簽章的 APK
        env:
          APP_VERSION: ${{ env.TAG }}
        run: gradle assembleRelease --no-daemon

      - name: 發佈新 release
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "spider-hero-$TAG.apk"
          gh release create "$TAG" "spider-hero-$TAG.apk" \
            --title "$TAG" --target "$GITHUB_SHA" --generate-notes --latest

      - name: 只保留最新 release（刪掉舊的與舊 tag）
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep -vx "$TAG" \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes; done
